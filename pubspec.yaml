name: system_casher
description: "نظام كاشير وإدارة مطعم - Restaurant POS & Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  intl: '>=0.19.0 <0.21.0'
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  printing: ^5.14.3
  pdf: ^3.11.3
  crypto: ^3.0.3
  excel: ^4.0.6
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf